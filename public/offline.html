<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0B2345">
    <title>You are offline - Glow Recruitment Agency Solution</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: linear-gradient(135deg, #071A33 0%, #0B2345 55%, #2C4A75 100%);
            color: #0F172A;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(4, 16, 31, 0.35);
            max-width: 440px;
            padding: 40px 32px;
            text-align: center;
            width: 100%;
        }

        img {
            height: 72px;
            margin-bottom: 24px;
            width: 72px;
        }

        h1 {
            font-size: 26px;
            line-height: 1.2;
            margin: 0 0 12px;
        }

        p {
            color: #475569;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 28px;
        }

        a {
            background: #0B2345;
            border-radius: 10px;
            color: #FFFFFF;
            display: inline-block;
            font-weight: 600;
            padding: 14px 22px;
            text-decoration: none;
        }

        a:hover {
            background: #2C4A75;
        }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="Glow Recruitment Agency Solution">
        <h1>You are offline</h1>
        <p>Check your internet connection and try again. Pages you already opened may still be available from your browser.</p>
        <a href="/">Try again</a>
    </main>
</body>
</html>
